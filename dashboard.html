<style>/* ==========================================================================
   PipSage Desk — original design system
   Graphite surfaces, amber signal accent, monospace data, crisp 1px borders.
   Deliberately not a card-and-gradient marketing aesthetic: this is a tool.
   ========================================================================== */

:root {
  /* surfaces */
  --bg: #0a0b0d;
  --panel: #0f1114;
  --panel-2: #14171b;
  --panel-3: #1b1f24;
  --panel-4: #23282f;

  /* lines */
  --line: #ffffff10;
  --line-2: #ffffff1c;
  --line-3: #ffffff30;

  /* ink */
  --ink: #e9ebee;
  --ink-2: #a6adb7;
  --ink-3: #737b86;
  --ink-4: #545b64;

  /* signals */
  --amber: #f5a524;
  --amber-2: #ffc25c;
  --amber-dim: #f5a52414;
  --amber-line: #f5a5243d;
  --teal: #2dd4bf;
  --teal-dim: #2dd4bf14;
  --green: #3fd68b;
  --green-dim: #3fd68b16;
  --red: #f2555a;
  --red-dim: #f2555a16;
  --blue: #5b9dff;
  --blue-dim: #5b9dff16;
  --violet: #9b7bff;

  /* geometry */
  --r-xs: 4px;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --rail: 212px;
  --rail-collapsed: 62px;
  --topbar: 52px;

  /* type */
  --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;

  --ease: cubic-bezier(.4, 0, .2, 1);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
}

/* ---------- light theme ---------- */
[data-theme='light'] {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --panel-2: #f2f4f6;
  --panel-3: #e9ecf0;
  --panel-4: #dfe3e9;
  --line: #0b0d1014;
  --line-2: #0b0d1026;
  --line-3: #0b0d1040;
  --ink: #12151a;
  --ink-2: #414954;
  --ink-3: #6b7480;
  --ink-4: #8d95a1;
  --amber: #b97300;
  --amber-2: #8f5a00;
  --amber-dim: #f5a5241f;
  --amber-line: #b9730040;
  --teal: #0f9488;
  --green: #128c5b;
  --green-dim: #128c5b14;
  --red: #cf2f36;
  --red-dim: #cf2f3614;
  --blue: #2b6fdc;
  --violet: #6d4de0;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  letter-spacing: -0.006em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; }
h1, h2, h3, h4, h5 { margin: 0; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
table { border-collapse: collapse; width: 100%; }
::selection { background: var(--amber-dim); }

:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 3px; }

/* ---------- typography helpers ---------- */
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.label {
  font-size: 10px; font-weight: 600; letter-spacing: 0.11em;
  text-transform: uppercase; color: var(--ink-3);
}
.label-lg { font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.h1 { font-size: 21px; font-weight: 600; letter-spacing: -0.025em; }
.h2 { font-size: 15px; font-weight: 600; }
.h3 { font-size: 13px; font-weight: 600; }
.sm { font-size: 12.5px; }
.xs { font-size: 11.5px; }
.muted { color: var(--ink-3); }
.dim { color: var(--ink-4); }
.up { color: var(--green); }
.dn { color: var(--red); }
.flat { color: var(--ink-3); }
.warn { color: var(--amber); }
.nowrap { white-space: nowrap; }
.tnum { font-variant-numeric: tabular-nums; }
.right { text-align: right; }
.center { text-align: center; }

/* ---------- shell ---------- */
.shell { display: flex; min-height: 100dvh; }

/* top bar */
.topbar {
  position: fixed; inset: 0 0 auto 0; height: var(--topbar); z-index: 60;
  display: flex; align-items: center; gap: 12px;
  padding: 0 14px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 9px; padding-right: 6px; }
.brand-glyph {
  width: 26px; height: 26px; border-radius: var(--r-sm);
  display: grid; place-items: center;
  background: linear-gradient(150deg, var(--panel-3), var(--panel));
  border: 1px solid var(--line-2);
  color: var(--amber);
  flex: 0 0 auto;
}
.brand-glyph svg { width: 15px; height: 15px; }
.brand-name { font-size: 13.5px; font-weight: 600; letter-spacing: -0.015em; white-space: nowrap; }
.brand-name em { font-style: normal; color: var(--ink-3); font-weight: 500; }

.cmd-trigger {
  display: flex; align-items: center; gap: 8px;
  height: 30px; padding: 0 9px; min-width: 260px;
  border: 1px solid var(--line-2); border-radius: var(--r-sm);
  background: var(--panel); color: var(--ink-3);
  font-size: 12.5px; transition: border-color .15s var(--ease), background .15s var(--ease);
}
.cmd-trigger:hover { border-color: var(--line-3); background: var(--panel-2); color: var(--ink-2); }
.cmd-trigger svg { width: 13px; height: 13px; flex: 0 0 auto; }
.cmd-trigger kbd {
  margin-left: auto; font-family: var(--mono); font-size: 10.5px;
  padding: 1px 5px; border-radius: 4px;
  border: 1px solid var(--line-2); color: var(--ink-4); background: var(--panel-2);
}
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }

.session-chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 26px; padding: 0 8px; border-radius: 100px;
  border: 1px solid var(--line-2); background: var(--panel);
  font-size: 11px; color: var(--ink-2); white-space: nowrap;
}
.session-chip i { width: 5px; height: 5px; border-radius: 50%; background: var(--green); display: block; }
.session-chip.closed i { background: var(--ink-4); }

.icon-btn {
  width: 30px; height: 30px; border-radius: var(--r-sm);
  display: grid; place-items: center; position: relative;
  border: 1px solid transparent; color: var(--ink-2);
  transition: background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);
}
.icon-btn:hover { background: var(--panel-2); color: var(--ink); border-color: var(--line); }
.icon-btn svg { width: 15px; height: 15px; }
.icon-btn .badge {
  position: absolute; top: 2px; right: 2px;
  min-width: 13px; height: 13px; padding: 0 3px; border-radius: 100px;
  background: var(--amber); color: #101216;
  font-size: 9px; font-weight: 700; display: grid; place-items: center;
}

/* rail */
.rail {
  position: fixed; top: var(--topbar); bottom: 0; left: 0; width: var(--rail);
  z-index: 50; display: flex; flex-direction: column;
  background: var(--panel); border-right: 1px solid var(--line);
  overflow-y: auto; overflow-x: hidden;
  transition: width .18s var(--ease);
  scrollbar-width: thin;
}
.rail-section { padding: 12px 8px 4px; }
.rail-section + .rail-section { padding-top: 6px; }
.rail-heading {
  font-size: 9.5px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase;
  color: var(--ink-4); padding: 4px 8px 6px; white-space: nowrap;
}
.rail-link {
  display: flex; align-items: center; gap: 9px;
  height: 32px; padding: 0 8px; border-radius: var(--r-sm);
  color: var(--ink-2); font-size: 13px; white-space: nowrap;
  transition: background .12s var(--ease), color .12s var(--ease);
  position: relative;
}
.rail-link svg { width: 15px; height: 15px; flex: 0 0 auto; color: var(--ink-3); transition: color .12s var(--ease); }
.rail-link:hover { background: var(--panel-2); color: var(--ink); }
.rail-link:hover svg { color: var(--ink-2); }
.rail-link.active { background: var(--amber-dim); color: var(--ink); font-weight: 500; }
.rail-link.active svg { color: var(--amber); }
.rail-link.active::before {
  content: ''; position: absolute; left: -8px; top: 7px; bottom: 7px;
  width: 2px; border-radius: 2px; background: var(--amber);
}
.rail-link .kbd-hint { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--ink-4); }
.rail-foot { margin-top: auto; padding: 8px; border-top: 1px solid var(--line); }

/* collapsed rail */
body.rail-mini { --rail: var(--rail-collapsed); }
body.rail-mini .rail-link span,
body.rail-mini .rail-heading,
body.rail-mini .rail-link .kbd-hint { display: none; }
body.rail-mini .rail-link { justify-content: center; padding: 0; }
body.rail-mini .rail-section { padding-inline: 8px; }
body.rail-mini .brand-name { display: none; }

/* main */
.main {
  flex: 1; min-width: 0;
  margin-left: var(--rail); padding-top: var(--topbar);
  transition: margin-left .18s var(--ease);
}
.page-head {
  position: sticky; top: var(--topbar); z-index: 40;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 14px 20px;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.page-head .titles { min-width: 0; }
.page-head h1 { font-size: 17px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
.page-head .sub { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
.page-head .actions { margin-left: auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.page-body { padding: 18px 20px 60px; display: grid; gap: 14px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 30px; padding: 0 11px; border-radius: var(--r-sm);
  font-size: 12.5px; font-weight: 500; white-space: nowrap;
  border: 1px solid var(--line-2); background: var(--panel-2); color: var(--ink);
  transition: background .14s var(--ease), border-color .14s var(--ease), color .14s var(--ease), transform .06s var(--ease);
}
.btn:hover { background: var(--panel-3); border-color: var(--line-3); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 13px; height: 13px; }
.btn-primary { background: var(--amber); border-color: var(--amber); color: #14100a; font-weight: 600; }
.btn-primary:hover { background: var(--amber-2); border-color: var(--amber-2); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--panel-2); color: var(--ink); border-color: var(--line); }
.btn-danger { color: var(--red); border-color: #f2555a3d; background: var(--red-dim); }
.btn-danger:hover { background: #f2555a26; }
.btn-sm { height: 26px; padding: 0 9px; font-size: 11.5px; }
.btn-lg { height: 36px; padding: 0 15px; font-size: 13px; }
.btn-block { width: 100%; }
.btn[disabled], .btn:disabled { opacity: .45; pointer-events: none; }
.btn-group { display: inline-flex; }
.btn-group .btn { border-radius: 0; border-right-width: 0; }
.btn-group .btn:first-child { border-radius: var(--r-sm) 0 0 var(--r-sm); }
.btn-group .btn:last-child { border-radius: 0 var(--r-sm) var(--r-sm) 0; border-right-width: 1px; }

/* segmented control */
.seg { display: inline-flex; padding: 2px; border-radius: var(--r-sm); background: var(--panel-2); border: 1px solid var(--line); }
.seg button {
  height: 24px; padding: 0 9px; border-radius: 4px;
  font-size: 11.5px; color: var(--ink-3); font-weight: 500;
  transition: background .12s var(--ease), color .12s var(--ease);
}
.seg button:hover { color: var(--ink); }
.seg button.active { background: var(--panel-4); color: var(--ink); }

/* ---------- panels ---------- */
.panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r-md); min-width: 0;
}
.panel-head {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-bottom: 1px solid var(--line);
  min-height: 42px;
}
.panel-head h2 { font-size: 12.5px; font-weight: 600; letter-spacing: -0.005em; }
.panel-head .sub { font-size: 11px; color: var(--ink-4); }
.panel-head .right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.panel-body { padding: 12px; }
.panel-body.flush { padding: 0; }
.panel-foot { padding: 8px 12px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--ink-4); }

/* grids */
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.g2-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.g1-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
.g3-2 { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
.span2 { grid-column: span 2; }
.span3 { grid-column: span 3; }

/* ---------- KPI tiles ---------- */
.kpi {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 12px 13px;
  display: flex; flex-direction: column; gap: 3px; min-width: 0;
  position: relative; overflow: hidden;
}
.kpi .k { display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.kpi .k svg { width: 11px; height: 11px; }
.kpi .v { font-family: var(--mono); font-size: 21px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi .v small { font-size: 12px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; }
.kpi .d { font-size: 11px; color: var(--ink-4); display: flex; align-items: center; gap: 4px; }
.kpi .spark { position: absolute; right: 0; bottom: 0; opacity: .5; pointer-events: none; }
.kpi.accent { border-color: var(--amber-line); background: linear-gradient(180deg, var(--amber-dim), var(--panel) 70%); }

/* ---------- tables ---------- */
.tbl { width: 100%; font-size: 12.5px; }
.tbl th {
  text-align: left; font-size: 9.5px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--ink-4);
  padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap;
  background: var(--panel); position: sticky; top: 0; z-index: 1;
}
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr { transition: background .1s var(--ease); }
.tbl tbody tr:hover { background: var(--panel-2); }
.tbl .num, .tbl td.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tbl th.num { text-align: right; }
.tbl-wrap { overflow: auto; max-height: 520px; }
.tbl-compact td { padding: 6px 10px; }

/* ---------- chips / tags ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  height: 19px; padding: 0 6px; border-radius: var(--r-xs);
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.01em;
  background: var(--panel-3); color: var(--ink-2); border: 1px solid var(--line);
  white-space: nowrap;
}
.chip-green { background: var(--green-dim); color: var(--green); border-color: #3fd68b33; }
.chip-red { background: var(--red-dim); color: var(--red); border-color: #f2555a33; }
.chip-amber { background: var(--amber-dim); color: var(--amber); border-color: var(--amber-line); }
.chip-blue { background: var(--blue-dim); color: var(--blue); border-color: #5b9dff33; }
.chip-teal { background: var(--teal-dim); color: var(--teal); border-color: #2dd4bf33; }
.chip-plain { background: transparent; }
.chip .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

.dot-live { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 #3fd68b66; animation: pulse 2.4s infinite; display: inline-block; }
.dot-idle { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-4); display: inline-block; }
.dot-warn { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); display: inline-block; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 #3fd68b55; }
  70% { box-shadow: 0 0 0 6px #3fd68b00; }
  100% { box-shadow: 0 0 0 0 #3fd68b00; }
}

/* ---------- forms ---------- */
.field { display: grid; gap: 5px; min-width: 0; }
.field > label { font-size: 11px; font-weight: 600; color: var(--ink-3); letter-spacing: 0.01em; }
.field .hint { font-size: 10.5px; color: var(--ink-4); }
.in, .sel, .ta {
  width: 100%; height: 32px; padding: 0 10px;
  background: var(--panel-2); border: 1px solid var(--line-2);
  border-radius: var(--r-sm); color: var(--ink); font-size: 12.5px;
  transition: border-color .14s var(--ease), background .14s var(--ease), box-shadow .14s var(--ease);
}
.ta { height: auto; min-height: 72px; padding: 8px 10px; line-height: 1.5; resize: vertical; }
.in:focus, .sel:focus, .ta:focus {
  outline: none; border-color: var(--amber-line);
  box-shadow: 0 0 0 3px #f5a5241f; background: var(--panel);
}
.in::placeholder, .ta::placeholder { color: var(--ink-4); }
.in:disabled { opacity: .55; cursor: not-allowed; }
.in.num, .in[type='number'] { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.sel {
  appearance: none; -webkit-appearance: none; padding-right: 26px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(100% - 14px) calc(50% + 1px), calc(100% - 9px) calc(50% + 1px);
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}
.in-group { display: flex; align-items: stretch; }
.in-group .in, .in-group .sel { border-radius: 0; }
.in-group > *:first-child { border-radius: var(--r-sm) 0 0 var(--r-sm); }
.in-group > *:last-child { border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.in-group > * + * { border-left-width: 0; }
.in-suffix {
  display: grid; place-items: center; padding: 0 9px; height: 32px;
  background: var(--panel-3); border: 1px solid var(--line-2); border-left: 0;
  border-radius: 0 var(--r-sm) var(--r-sm) 0; font-size: 11.5px; color: var(--ink-3); white-space: nowrap;
}
.check { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
.check input { appearance: none; width: 15px; height: 15px; margin: 1px 0 0; flex: 0 0 auto;
  border: 1px solid var(--line-3); border-radius: 4px; background: var(--panel-2); cursor: pointer;
  transition: background .12s var(--ease), border-color .12s var(--ease); position: relative; }
.check input:checked { background: var(--amber); border-color: var(--amber); }
.check input:checked::after {
  content: ''; position: absolute; inset: 0;
  background: #14100a;
  clip-path: polygon(18% 52%, 40% 72%, 82% 26%, 90% 36%, 40% 88%, 10% 60%);
}
.check input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.switch { position: relative; width: 32px; height: 18px; flex: 0 0 auto; }
.switch input { appearance: none; width: 100%; height: 100%; margin: 0; border-radius: 100px;
  background: var(--panel-4); border: 1px solid var(--line-2); cursor: pointer; transition: background .15s var(--ease); }
.switch input:checked { background: var(--amber); border-color: var(--amber); }
.switch input::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px;
  border-radius: 50%; background: #fff; transition: transform .15s var(--ease-out);
}
.switch input:checked::after { transform: translateX(14px); background: #14100a; }

/* ---------- sliders ---------- */
.range { display: grid; gap: 6px; }
.range input[type='range'] {
  appearance: none; -webkit-appearance: none; width: 100%; height: 4px; margin: 0;
  border-radius: 100px; background: var(--panel-4); cursor: pointer;
}
.range input[type='range']::-webkit-slider-thumb {
  appearance: none; width: 13px; height: 13px; border-radius: 50%;
  background: var(--amber); border: 2px solid var(--panel);
  box-shadow: 0 0 0 1px var(--amber-line); cursor: grab;
}
.range input[type='range']::-moz-range-thumb {
  width: 13px; height: 13px; border-radius: 50%; background: var(--amber); border: 2px solid var(--panel);
}
.range .row { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-2); }
.range .row b { font-family: var(--mono); color: var(--ink); font-weight: 600; }

/* ---------- progress ---------- */
.bar { height: 5px; border-radius: 100px; background: var(--panel-4); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 100px; background: var(--amber); transition: width .4s var(--ease-out); }
.bar.green > i { background: var(--green); }
.bar.red > i { background: var(--red); }
.bar.teal > i { background: var(--teal); }
.bar.thin { height: 3px; }

/* ---------- empty / misc ---------- */
.empty { padding: 28px 14px; text-align: center; color: var(--ink-4); font-size: 12.5px; }
.empty svg { width: 22px; height: 22px; margin: 0 auto 8px; color: var(--ink-4); opacity: .7; }
.divider { height: 1px; background: var(--line); border: 0; margin: 0; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.row { display: flex; align-items: center; gap: 8px; }
.col { display: grid; gap: 8px; }
.wrap-row { display: flex; flex-wrap: wrap; gap: 6px; }

.kv { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 5px 0; font-size: 12.5px; }
.kv + .kv { border-top: 1px solid var(--line); }
.kv span:first-child { color: var(--ink-3); }
.kv span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- charts ---------- */
.chart-box { position: relative; width: 100%; }
.chart-box svg { display: block; width: 100%; overflow: visible; }
.chart-box canvas { display: block; width: 100%; touch-action: pan-y; }
.panel-body .chart-box { min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: var(--ink-3); }
.legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; vertical-align: middle; }
.axis-label { font-family: var(--mono); font-size: 9.5px; fill: var(--ink-4); }
.grid-line { stroke: var(--line); stroke-width: 1; }

/* heatmap */
.heat { display: grid; gap: 3px; }
.heat-cell {
  aspect-ratio: 1.9; border-radius: 3px; display: grid; place-items: center;
  font-family: var(--mono); font-size: 9.5px; color: var(--ink-2);
  border: 1px solid transparent; cursor: default;
}
.heat-cell:hover { border-color: var(--line-3); }
.heat-head { font-size: 9.5px; color: var(--ink-4); text-align: center; letter-spacing: .04em; }

/* ---------- modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
  background: #05060899; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  padding: 20px; animation: fade .14s var(--ease);
}
@keyframes fade { from { opacity: 0; } }
.modal {
  width: 100%; max-width: 480px; max-height: 86dvh; overflow: auto;
  background: var(--panel); border: 1px solid var(--line-2);
  border-radius: var(--r-lg); box-shadow: 0 24px 70px -20px #000;
  animation: pop .18s var(--ease-out);
}
@keyframes pop { from { transform: translateY(8px) scale(.99); opacity: 0; } }
.modal.wide { max-width: 720px; }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 13px 15px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 13.5px; }
.modal-head .icon-btn { margin-left: auto; }
.modal-body { padding: 15px; display: grid; gap: 12px; }
.modal-foot { padding: 11px 15px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }

/* ---------- command palette ---------- */
.palette-backdrop {
  position: fixed; inset: 0; z-index: 110; background: #05060899;
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  display: flex; justify-content: center; padding-top: 12vh;
  animation: fade .12s var(--ease);
}
.palette {
  width: 100%; max-width: 540px; height: fit-content; max-height: 62dvh;
  background: var(--panel); border: 1px solid var(--line-2);
  border-radius: var(--r-lg); box-shadow: 0 30px 80px -24px #000;
  display: flex; flex-direction: column; overflow: hidden;
  animation: pop .16s var(--ease-out);
}
.palette-input {
  display: flex; align-items: center; gap: 9px; padding: 0 14px;
  height: 46px; border-bottom: 1px solid var(--line); flex: 0 0 auto;
}
.palette-input svg { width: 15px; height: 15px; color: var(--ink-3); }
.palette-input input { flex: 1; border: 0; background: none; outline: none; font-size: 14px; color: var(--ink); }
.palette-input input::placeholder { color: var(--ink-4); }
.palette-list { overflow-y: auto; padding: 6px; }
.palette-group { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-4); padding: 8px 8px 4px; font-weight: 700; }
.palette-item {
  display: flex; align-items: center; gap: 9px; padding: 8px 9px; border-radius: var(--r-sm);
  font-size: 13px; color: var(--ink-2); cursor: pointer;
}
.palette-item svg { width: 14px; height: 14px; color: var(--ink-3); flex: 0 0 auto; }
.palette-item .sub { margin-left: auto; font-size: 11px; color: var(--ink-4); }
.palette-item.active, .palette-item:hover { background: var(--panel-3); color: var(--ink); }
.palette-item.active svg { color: var(--amber); }
.palette-foot { border-top: 1px solid var(--line); padding: 7px 12px; font-size: 10.5px; color: var(--ink-4); display: flex; gap: 12px; }
.palette-foot kbd { font-family: var(--mono); border: 1px solid var(--line-2); border-radius: 3px; padding: 0 4px; }

/* ---------- toast ---------- */
.toasts { position: fixed; bottom: 16px; right: 16px; z-index: 120; display: grid; gap: 8px; justify-items: end; }
.toast {
  display: flex; align-items: center; gap: 8px;
  background: var(--panel-3); border: 1px solid var(--line-2);
  border-radius: var(--r-sm); padding: 9px 12px; font-size: 12.5px;
  box-shadow: 0 14px 32px -14px #000; max-width: 340px;
  animation: slide-in .2s var(--ease-out);
}
@keyframes slide-in { from { transform: translateX(14px); opacity: 0; } }
.toast.out { animation: slide-out .18s var(--ease) forwards; }
@keyframes slide-out { to { transform: translateX(14px); opacity: 0; } }
.toast svg { width: 14px; height: 14px; flex: 0 0 auto; }
.toast.ok svg { color: var(--green); }
.toast.err svg { color: var(--red); }
.toast.warn svg { color: var(--amber); }

/* ---------- drawer (alerts / notifications) ---------- */
.drawer-backdrop { position: fixed; inset: 0; z-index: 95; background: #05060880; animation: fade .12s var(--ease); }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: 100%; max-width: 360px; z-index: 96;
  background: var(--panel); border-left: 1px solid var(--line-2);
  display: flex; flex-direction: column; animation: drawer-in .2s var(--ease-out);
}
@keyframes drawer-in { from { transform: translateX(24px); opacity: .6; } }
.drawer-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.drawer-body { overflow-y: auto; padding: 10px; display: grid; gap: 8px; }
.alert-item {
  display: grid; gap: 3px; padding: 9px 10px; border-radius: var(--r-sm);
  background: var(--panel-2); border: 1px solid var(--line);
}
.alert-item.unread { border-color: var(--amber-line); background: var(--amber-dim); }
.alert-item .t { font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
.alert-item .b { font-size: 11.5px; color: var(--ink-3); }
.alert-item time { font-family: var(--mono); font-size: 10px; color: var(--ink-4); }

/* ---------- assistant ---------- */
.chat-shell { display: grid; grid-template-rows: 1fr auto; height: calc(100dvh - var(--topbar) - 61px); }
.chat-scroll { overflow-y: auto; padding: 18px 20px; }
.chat-inner { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
.msg { display: flex; gap: 9px; }
.msg-avatar {
  width: 24px; height: 24px; border-radius: var(--r-sm); flex: 0 0 auto;
  display: grid; place-items: center; font-size: 10px; font-weight: 700;
  background: var(--panel-3); border: 1px solid var(--line-2); color: var(--ink-2);
}
.msg.ai .msg-avatar { background: var(--amber-dim); border-color: var(--amber-line); color: var(--amber); }
.msg-body { font-size: 13px; line-height: 1.6; color: var(--ink-2); min-width: 0; }
.msg-body strong { color: var(--ink); font-weight: 600; }
.msg-body code { font-family: var(--mono); font-size: 12px; background: var(--panel-3); padding: 1px 4px; border-radius: 3px; color: var(--ink); }
.msg-body ul { margin: 6px 0 0; display: grid; gap: 3px; }
.msg-body li { padding-left: 13px; position: relative; }
.msg-body li::before { content: ''; position: absolute; left: 0; top: 8px; width: 4px; height: 4px; border-radius: 1px; background: var(--amber); }
.msg-card { margin-top: 9px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel-2); overflow: hidden; }
.msg-card .row-kv { display: flex; justify-content: space-between; gap: 12px; padding: 6px 10px; font-size: 12px; }
.msg-card .row-kv + .row-kv { border-top: 1px solid var(--line); }
.msg-card .row-kv span:last-child { font-family: var(--mono); }
.chat-input-wrap { border-top: 1px solid var(--line); padding: 10px 20px 14px; background: var(--bg); }
.chat-suggestions { max-width: 760px; margin: 0 auto 7px; display: flex; flex-wrap: wrap; gap: 5px; }
.sugg {
  font-size: 11.5px; padding: 4px 9px; border-radius: 100px;
  border: 1px solid var(--line-2); background: var(--panel); color: var(--ink-3);
  transition: color .12s var(--ease), border-color .12s var(--ease);
}
.sugg:hover { color: var(--ink); border-color: var(--line-3); }
.chat-form { max-width: 760px; margin: 0 auto; display: flex; gap: 7px; align-items: flex-end; }
.chat-form textarea {
  flex: 1; min-height: 38px; max-height: 130px; resize: none; padding: 9px 11px;
  background: var(--panel-2); border: 1px solid var(--line-2); border-radius: var(--r-sm);
  color: var(--ink); font-size: 13px; line-height: 1.45;
}
.chat-form textarea:focus { outline: none; border-color: var(--amber-line); box-shadow: 0 0 0 3px #f5a5241f; }
.typing { display: inline-flex; gap: 3px; align-items: center; }
.typing i { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-3); animation: bounce 1.1s infinite; }
.typing i:nth-child(2) { animation-delay: .13s; }
.typing i:nth-child(3) { animation-delay: .26s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-3px); opacity: 1; } }

/* ---------- setup / checklist ---------- */
.check-list { display: grid; gap: 6px; }
.check-item {
  display: flex; align-items: center; gap: 9px; padding: 8px 10px;
  border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel-2);
  font-size: 12.5px; cursor: pointer;
  transition: border-color .12s var(--ease), background .12s var(--ease);
}
.check-item:hover { border-color: var(--line-2); }
.check-item.done { border-color: #3fd68b3d; background: var(--green-dim); }
.check-item.done .txt { color: var(--ink-3); text-decoration: line-through; }
.check-box {
  width: 16px; height: 16px; border-radius: 4px; flex: 0 0 auto;
  border: 1px solid var(--line-3); display: grid; place-items: center;
  background: var(--panel-3);
}
.check-item.done .check-box { background: var(--green); border-color: var(--green); }
.check-box svg { width: 10px; height: 10px; color: #06120c; }

/* ---------- calendar ---------- */
.cal-event {
  display: grid; grid-template-columns: 62px 1fr auto; gap: 10px; align-items: center;
  padding: 8px 11px; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--panel-2);
}
.cal-event .time { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
.cal-event .name { font-size: 12.5px; }
.cal-event .meta { font-size: 10.5px; color: var(--ink-4); }
.impact { display: inline-flex; gap: 2px; }
.impact i { width: 4px; height: 10px; border-radius: 1px; background: var(--panel-4); display: block; }
.impact.high i:nth-child(-n+3) { background: var(--red); }
.impact.med i:nth-child(-n+2) { background: var(--amber); }
.impact.low i:nth-child(-n+1) { background: var(--blue); }
.cal-event.next { border-color: var(--amber-line); background: var(--amber-dim); }

/* ---------- misc components ---------- */
.stat-list { display: grid; }
.stat-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 7px 0; font-size: 12.5px; border-bottom: 1px solid var(--line);
}
.stat-row:last-child { border-bottom: 0; }
.stat-row .k { color: var(--ink-3); display: flex; align-items: center; gap: 6px; min-width: 0; }
.stat-row .k span, .stat-row .k { white-space: nowrap; }
.stat-row .k svg { width: 12px; height: 12px; flex: 0 0 auto; opacity: .8; }
.stat-row .v { font-family: var(--mono); font-weight: 500; }

.legend-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

.gauge { position: relative; width: 100%; display: grid; place-items: center; }
.gauge svg { overflow: visible; }
.gauge .val { position: absolute; text-align: center; }
.gauge .val b { display: block; font-family: var(--mono); font-size: 20px; font-weight: 600; letter-spacing: -.03em; }
.gauge .val span { font-size: 10px; color: var(--ink-4); letter-spacing: .06em; text-transform: uppercase; }

.note-card {
  padding: 12px; border-radius: var(--r-sm); border: 1px solid var(--line);
  background: var(--panel-2); display: grid; gap: 6px;
}
.note-card .head { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.note-card .body { font-size: 12.5px; color: var(--ink-2); line-height: 1.55; white-space: pre-wrap; }
.note-card time { font-family: var(--mono); font-size: 10px; color: var(--ink-4); }

.pill-nav { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
.pill-nav button {
  padding: 4px 9px; border-radius: 100px; font-size: 11.5px; color: var(--ink-3);
  border: 1px solid var(--line); white-space: nowrap;
}
.pill-nav button.active { background: var(--panel-3); color: var(--ink); border-color: var(--line-2); }

/* scrollbars */
* { scrollbar-width: thin; scrollbar-color: var(--panel-4) transparent; }
*::-webkit-scrollbar { width: 9px; height: 9px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: var(--panel-4); border-radius: 100px; border: 2px solid var(--bg); }
*::-webkit-scrollbar-thumb:hover { background: #333a43; }

/* sr-only / skip */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 10px; top: -50px; z-index: 200; background: var(--amber); color: #14100a;
  padding: 7px 12px; border-radius: var(--r-sm); font-size: 12.5px; font-weight: 600; transition: top .15s var(--ease); }
.skip:focus { top: 8px; }

/* ---------- responsive ---------- */
@media (max-width: 1240px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g3-2, .g2-1, .g1-2 { grid-template-columns: 1fr; }
}
@media (max-width: 1080px) {
  :root { --rail: var(--rail-collapsed); }
  .rail-link span, .rail-heading, .rail-link .kbd-hint, .brand-name { display: none; }
  .rail-link { justify-content: center; padding: 0; }
  .rail-foot { display: none; }
  .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .topbar { gap: 8px; padding: 0 10px; }
  .cmd-trigger { min-width: 0; flex: 1; }
  .cmd-trigger .cmd-text, .cmd-trigger kbd { display: none; }
  .page-body { padding: 14px 12px 60px; }
  .page-head { padding: 12px; }
  .g2 { grid-template-columns: 1fr; }
  .g4, .g6, .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .session-chip span { display: none; }
}
@media (max-width: 620px) {
  :root { --rail: 0px; }
  .rail {
    top: auto; bottom: 0; left: 0; right: 0; width: 100%; height: 56px;
    flex-direction: row; align-items: center; gap: 2px;
    border-right: 0; border-top: 1px solid var(--line);
    padding: 0 6px; overflow-x: auto; overflow-y: hidden;
  }
  .rail-section { display: contents; }
  .rail-heading { display: none; }
  .rail-link { flex-direction: column; gap: 2px; height: 48px; width: 56px; justify-content: center; padding: 0; flex: 0 0 auto; }
  .rail-link svg { width: 17px; height: 17px; }
  .rail-link.active::before { left: 50%; top: 2px; transform: translateX(-50%); width: 16px; height: 2px; }
  .rail-link span { display: block; font-size: 9px; }
  .rail-foot { display: none; }
  .main { margin-left: 0; padding-bottom: 56px; }
  .g4, .g6, .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi .v { font-size: 18px; }
  .page-head h1 { font-size: 15px; }
  .chat-shell { height: calc(100dvh - var(--topbar) - 56px - 52px); }
  .chat-scroll { padding: 14px 12px; }
  .chat-input-wrap { padding: 8px 12px 60px; }
  .toasts { left: 12px; right: 12px; justify-items: stretch; }
  .toast { max-width: none; }
}
@media (max-width: 620px) {
  /* denser tiles so a phone shows the numbers without endless scrolling */
  .g4, .g6 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 8px; }
  .kpi { padding: 10px 11px; }
  .kpi .v { font-size: 17px; letter-spacing: -.01em; }
  .kpi .k { font-size: 9.5px; letter-spacing: .07em; }
  .kpi .d { font-size: 10.5px; }
  .panel { border-radius: var(--r-md); }
  .panel-head { padding: 10px 12px; }
  /* bottom rail: scrollable, with a hint that more sits off-screen */
  .rail::after {
    content: ''; position: sticky; right: 0; flex: 0 0 22px; align-self: stretch;
    background: linear-gradient(90deg, transparent, var(--bg) 70%); pointer-events: none;
  }
  .palette-backdrop { padding-top: 54px; align-items: flex-start; }
  .page-head .actions { width: 100%; }
  .page-head .actions .btn { flex: 1 1 auto; justify-content: center; }
}
@media (max-width: 420px) {
  .g3 { grid-template-columns: 1fr; }
  .g4, .g6 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .kpi .v { font-size: 15.5px; }
  .kpi { padding: 9px 10px; }
  .rail-link { width: 50px; }
  .span2, .span3 { grid-column: auto; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* print */
@media print {
  .topbar, .rail, .page-head .actions, .toasts, .icon-btn { display: none !important; }
  .main { margin: 0; padding: 0; }
  body { background: #fff; color: #000; }
  .panel { border-color: #ccc; break-inside: avoid; }
}

    String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  PS.esc = esc;

  const uid = (p = 'id') => p + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
  PS.uid = uid;

  PS.klass = (n) => (n > 0 ? 'up' : n < 0 ? 'dn' : 'flat');
  PS.decimals = (price) => (price >= 1000 ? 2 : price >= 100 ? 3 : price >= 10 ? 4 : 5);
  PS.fmtPrice = (p) => fmt(p, PS.decimals(p));

  const dt = (ts) => new Date(ts);
  PS.dateShort = (ts) => dt(ts).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
  PS.dateFull = (ts) =>
    dt(ts).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  PS.timeShort = (ts) => dt(ts).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  PS.isoDate = (ts) => new Date(ts).toISOString().slice(0, 10);
  PS.ago = (ts) => {
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  };
  PS.dayName = (i) => ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][i];

  PS.debounce = (fn, ms = 220) => {
    let t;
    return (...a) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...a), ms);
    };
  };

  PS.range = (n, f = (i) => i) => Array.from({ length: n }, (_, i) => f(i));

  /* deterministic RNG so sample series are stable between reloads */
  PS.rng = (seed) => {
    let s = Math.abs(Math.floor(seed)) % 2147483647 || 1;
    return () => ((s = (s * 16807) % 2147483647) - 1) / 2147483646;
  };

  /* ------------------------------------------------------------------ store */
  const NS = 'pipsage.';
  const KEYS = {
    gate: NS + 'gate',
    seedDisabled: NS + 'seed-disabled',
    settings: NS + 'settings',
    trades: NS + 'trades',
    accounts: NS + 'accounts',
    strategies: NS + 'strategies',
    watchlist: NS + 'watchlist',
    notes: NS + 'notes',
    tasks: NS + 'tasks',
    alerts: NS + 'alerts',
    chat: NS + 'chat',
    snippets: NS + 'snippets',
    journalEntries: NS + 'reflections',
    reflections: NS + 'reflections',
    riskstate: NS + 'riskstate',
    events: NS + 'events',
    habits: NS + 'habits',
  };
  PS.KEYS = KEYS;

  const Store = {
    get(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw == null) return fallback;
        return JSON.parse(raw);
      } catch (e) {
        return fallback;
      }
    },
    set(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
        return true;
      } catch (e) {
        PS.toast('Storage is full or blocked', 'err');
        return false;
      }
    },
    del(key) {
      try {
        localStorage.removeItem(key);
      } catch (e) {}
    },
    all() {
      const out = {};
      Object.entries(KEYS).forEach(([name, key]) => {
        const v = localStorage.getItem(key);
        if (v != null) out[name] = JSON.parse(v);
      });
      return out;
    },
    load(blob) {
      const data = blob && blob.data ? blob.data : blob;
      Object.entries(data || {}).forEach(([name, val]) => {
        if (KEYS[name] && val != null) Store.set(KEYS[name], val);
      });
    },
    wipe() {
      Object.values(KEYS).forEach((k) => Store.del(k));
    },
    size() {
      let b = 0;
      Object.values(KEYS).forEach((k) => {
        const v = localStorage.getItem(k);
        if (v) b += v.length * 2;
      });
      return b;
    },
  };
  PS.Store = Store;

  /* ------------------------------------------------------------------ defaults */
  PS.DEFAULT_SETTINGS = {
    name: 'Trader',
    currency: 'USD',
    startingBalance: 10000,
    riskPerTrade: 1.25,
    maxOpenPositions: 3,
    dailyLossLimit: 4,
    weeklyLossLimit: 8,
    maxSpread: 25,
    newsBlackout: true,
    sessionFilter: 'all',
    theme: 'dark',
    density: 'comfortable',
    railMini: false,
    timezone: 'Africa/Lagos',
    brokerServer: '',
    brokerLogin: '',
  };

  const settings = () => Object.assign({}, PS.DEFAULT_SETTINGS, Store.get(KEYS.settings, {}));
  PS.settings = settings;
  PS.saveSettings = (patch) => {
    const next = Object.assign(settings(), patch);
    Store.set(KEYS.settings, next);
    return next;
  };

  /* ------------------------------------------------------------------ markets */
  /* Sample instrument universe. Prices are illustrative and deterministic;
     connect a real feed by replacing PS.MARKET.base values. */
  PS.SYMBOLS = [
    { sym: 'XAUUSD', contract: 100, name: 'Gold', cls: 'Metals', base: 3563.54, vol: 0.9, dec: 2, unit: 'USD/oz' },
    { sym: 'EURUSD', contract: 100000, name: 'Euro / Dollar', cls: 'Forex', base: 1.09659, vol: 0.22, dec: 5, unit: 'rate' },
    { sym: 'GBPUSD', contract: 100000, name: 'Sterling / Dollar', cls: 'Forex', base: 1.31119, vol: 0.26, dec: 5, unit: 'rate' },
    { sym: 'USDJPY', contract: 100000, name: 'Dollar / Yen', cls: 'Forex', base: 159.219, vol: 0.3, dec: 3, unit: 'rate' },
    { sym: 'USDCAD', contract: 100000, name: 'Dollar / Loonie', cls: 'Forex', base: 1.43055, vol: 0.2, dec: 5, unit: 'rate' },
    { sym: 'AUDUSD', contract: 100000, name: 'Aussie / Dollar', cls: 'Forex', base: 0.66392, vol: 0.18, dec: 5, unit: 'rate' },
    { sym: 'NZDUSD', contract: 100000, name: 'Kiwi / Dollar', cls: 'Forex', base: 0.54837, vol: 0.17, dec: 5, unit: 'rate' },
    { sym: 'USDCHF', contract: 100000, name: 'Dollar / Franc', cls: 'Forex', base: 0.8821, vol: 0.19, dec: 5, unit: 'rate' },
    { sym: 'XAGUSD', contract: 5000, name: 'Silver', cls: 'Metals', base: 41.031, vol: 1.4, dec: 3, unit: 'USD/oz' },
    { sym: 'BTCUSD', contract: 1, name: 'Bitcoin', cls: 'Crypto', base: 60028, vol: 3.2, dec: 1, unit: 'USD' },
    { sym: 'ETHUSD', contract: 1, name: 'Ethereum', cls: 'Crypto', base: 1681.0, vol: 3.6, dec: 2, unit: 'USD' },
    { sym: 'NAS100', contract: 1, name: 'Nasdaq 100', cls: 'Indices', base: 19845.5, vol: 1.1, dec: 1, unit: 'pts' },
    { sym: 'US30', contract: 1, name: 'Dow 30', cls: 'Indices', base: 42130.0, vol: 0.9, dec: 1, unit: 'pts' },
    { sym: 'SPX500', contract: 1, name: 'S&P 500', cls: 'Indices', base: 5732.4, vol: 0.8, dec: 2, unit: 'pts' },
    { sym: 'USOIL', contract: 1000, name: 'Crude Oil', cls: 'Energy', base: 78.42, vol: 1.6, dec: 2, unit: 'USD/bbl' },
    { sym: 'GER40', contract: 1, name: 'DAX 40', cls: 'Indices', base: 18240.5, vol: 0.95, dec: 1, unit: 'pts' },
  ];
  PS.symMeta = (s) => PS.SYMBOLS.find((x) => x.sym === s) || { sym: s, name: s, cls: 'Other', base: 100, vol: 1, dec: 2, unit: '' };

  /* contract size per instrument */
  PS.contractOf = (sym) => PS.symMeta(sym).contract || 1;

  /* Instruments quoted in a non-USD currency: profit is denominated in the quote
     currency, so convert back to the account currency at the exit rate. */
  PS.quoteCcy = (sym) => {
    if (/^USD(JPY|CAD|CHF)$/.test(sym)) return sym.slice(3);
    if (/^(EUR|GBP|AUD|NZD)USD$/.test(sym)) return 'USD';
    return 'USD';
  };

  /* The one place trade P&L is calculated. */
  PS.pnlFor = function (sym, side, lots, entry, exit) {
    const contract = PS.contractOf(sym);
    const dir = side === 'buy' ? 1 : -1;
    const raw = (Number(exit) - Number(entry)) * dir * Number(lots) * contract;
    const q = PS.quoteCcy(sym);
    if (q !== 'USD' && exit) return +(raw / Number(exit)).toFixed(2);
    return +raw.toFixed(2);
  };

  /* R multiple in account currency: P&L at exit divided by cash risk at stop. */
  PS.rFor = function (sym, side, lots, entry, exit, stop) {
    if (!stop || !exit) return 0;
    const riskCash = PS.riskCashFor(sym, lots, entry, stop);
    if (!Number.isFinite(riskCash) || riskCash <= 0) return 0;
    const pnl = PS.pnlFor(sym, side, lots, entry, exit);
    if (!Number.isFinite(pnl)) return 0;
    return +((pnl / riskCash).toFixed(2));
  };

  /* cash at risk for a position */
  PS.riskCashFor = function (sym, lots, entry, stop) {
    if (!stop) return 0;
    return Math.abs(PS.pnlFor(sym, 'buy', lots, entry, stop));
  };

  /* daily change, deterministic per symbol per day */
  PS.dailyChange = (sym) => {
    const meta = PS.symMeta(sym);
    const seed = sym.split('').reduce((a, c) => a + c.charCodeAt(0), 0) + Math.floor(Date.now() / 864e5);
    const r = PS.rng(seed);
    return (r() - 0.45) * meta.vol * 2.6;
  };
  PS.price = (sym) => {
    const meta = PS.symMeta(sym);
    return meta.base * (1 + PS.dailyChange(sym) / 100);
  };

  /* seeded OHLC series */
  PS.candles = (sym, count = 90, tfBias = 1) => {
    const meta = PS.symMeta(sym);
    const seed = sym.split('').reduce((a, c) => a + c.charCodeAt(0) * 13, 7) + Math.round(tfBias * 100);
    const r = PS.rng(seed);
    const step = meta.base * (meta.vol / 100) * 0.55;
    let p = meta.base * (1 - meta.vol / 220);
    const out = [];
    for (let i = 0; i < count; i++) {
      const drift = (r() - 0.47) * step * 1.6 + Math.sin(i / 9) * step * 0.5;
      const open = p;
      const close = open + drift;
      const hi = Math.max(open, close) + r() * step * 0.9;
      const lo = Math.min(open, close) - r() * step * 0.9;
      out.push({ t: Date.now() - (count - i) * 36e5 * tfBias, o: open, h: hi, l: lo, c: close, v: 900 + r() * 2600 });
      p = close;
    }
    return out;
  };

  /* ------------------------------------------------------------------ indicators */
  const Ind = {};
  PS.Ind = Ind;

  Ind.sma = (vals, n) =>
    vals.map((_, i) => (i < n - 1 ? null : vals.slice(i - n + 1, i + 1).reduce((a, b) => a + b, 0) / n));

  Ind.ema = (vals, n) => {
    const k = 2 / (n + 1);
    let prev = null;
    return vals.map((v, i) => {
      if (i < n - 1) return null;
      if (prev == null) {
        prev = vals.slice(0, n).reduce((a, b) => a + b, 0) / n;
        return prev;
      }
      prev = v * k + prev * (1 - k);
      return prev;
    });
  };

  Ind.rsi = (vals, n = 14) => {
    const out = new Array(vals.length).fill(null);
    if (vals.length < n + 1) return out;
    let gain = 0;
    let loss = 0;
    for (let i = 1; i <= n; i++) {
      const d = vals[i] - vals[i - 1];
      if (d >= 0) gain += d; else loss -= d;
    }
    gain /= n; loss /= n;
    out[n] = loss === 0 ? 100 : 100 - 100 / (1 + gain / loss);
    for (let i = n + 1; i < vals.length; i++) {
      const d = vals[i] - vals[i - 1];
      gain = (gain * (n - 1) + Math.max(d, 0)) / n;
      loss = (loss * (n - 1) + Math.max(-d, 0)) / n;
      out[i] = loss === 0 ? 100 : 100 - 100 / (1 + gain / loss);
    }
    return out;
  };

  Ind.atr = (candles, n = 14) => {
    const tr = candles.map((c, i) => {
      if (i === 0) return c.h - c.l;
      const pc = candles[i - 1].c;
      return Math.max(c.h - c.l, Math.abs(c.h - pc), Math.abs(c.l - pc));
    });
    return Ind.ema(tr, n);
  };

  Ind.macd = (vals, fast = 12, slow = 26, sig = 9) => {
    const ef = Ind.ema(vals, fast);
    const es = Ind.ema(vals, slow);
    const line = vals.map((_, i) => (ef[i] == null || es[i] == null ? null : ef[i] - es[i]));
    const clean = line.map((v) => v || 0);
    const signal = Ind.ema(clean, sig).map((v, i) => (line[i] == null ? null : v));
    const hist = line.map((v, i) => (v == null || signal[i] == null ? null : v - signal[i]));
    return { line, signal, hist };
  };

  Ind.bollinger = (vals, n = 20, mult = 2) => {
    const mid = Ind.sma(vals, n);
    const upper = [];
    const lower = [];
    vals.forEach((_, i) => {
      if (mid[i] == null) { upper.push(null); lower.push(null); return; }
      const slice = vals.slice(i - n + 1, i + 1);
      const m = mid[i];
      const sd = Math.sqrt(slice.reduce((a, v) => a + (v - m) ** 2, 0) / n);
      upper.push(m + mult * sd);
      lower.push(m - mult * sd);
    });
    return { mid, upper, lower };
  };

  Ind.stoch = (candles, n = 14, smooth = 3) => {
    const raw = candles.map((c, i) => {
      if (i < n - 1) return null;
      const slice = candles.slice(i - n + 1, i + 1);
      const hi = Math.max(...slice.map((x) => x.h));
      const lo = Math.min(...slice.map((x) => x.l));
      return hi === lo ? 50 : ((c.c - lo) / (hi - lo)) * 100;
    });
    return Ind.sma(raw.map((v) => v || 50), smooth).map((v, i) => (raw[i] == null ? null : v));
  };

  Ind.adx = (candles, n = 14) => {
    const plusDM = [];
    const minusDM = [];
    const tr = [];
    candles.forEach((c, i) => {
      if (i === 0) { plusDM.push(0); minusDM.push(0); tr.push(c.h - c.l); return; }
      const up = c.h - candles[i - 1].h;
      const dn = candles[i - 1].l - c.l;
      plusDM.push(up > dn && up > 0 ? up : 0);
      minusDM.push(dn > up && dn > 0 ? dn : 0);
      const pc = candles[i - 1].c;
      tr.push(Math.max(c.h - c.l, Math.abs(c.h - pc), Math.abs(c.l - pc)));
    });
    const atr = Ind.ema(tr, n);
    const pdi = Ind.ema(plusDM, n).map((v, i) => (v == null || !atr[i] ? null : (100 * v) / atr[i]));
    const mdi = Ind.ema(minusDM, n).map((v, i) => (v == null || !atr[i] ? null : (100 * v) / atr[i]));
    const dx = pdi.map((p, i) => (p == null || mdi[i] == null ? null : (100 * Math.abs(p - mdi[i])) / (p + mdi[i] || 1)));
    return { adx: Ind.ema(dx.map((v) => v || 0), n), pdi, mdi };
  };

  Ind.donchian = (candles, n = 20) => ({
    upper: candles.map((c, i) => (i < n - 1 ? null : Math.max(...candles.slice(i - n + 1, i + 1).map((x) => x.h)))),
    lower: candles.map((c, i) => (i < n - 1 ? null : Math.min(...candles.slice(i - n + 1, i + 1).map((x) => x.l)))),
  });

  Ind.obv = (candles) => {
    let acc = 0;
    return candles.map((c, i) => {
      if (i > 0) acc += c.c > candles[i - 1].c ? c.v : c.c < candles[i - 1].c ? -c.v : 0;
      return acc;
    });
  };

  Ind.vwap = (candles) => {
    let pv = 0;
    let vv = 0;
    return candles.map((c) => {
      const tp = (c.h + c.l + c.c) / 3;
      pv += tp * c.v;
      vv += c.v;
      return pv / vv;
    });
  };

  Ind.williams = (candles, n = 14) =>
    candles.map((c, i) => {
      if (i < n - 1) return null;
      const slice = candles.slice(i - n + 1, i + 1);
      const hi = Math.max(...slice.map((x) => x.h));
      const lo = Math.min(...slice.map((x) => x.l));
      return hi === lo ? -50 : ((hi - c.c) / (hi - lo)) * -100;
    });

  Ind.supertrend = (candles, n = 10, mult = 3) => {
    const atr = Ind.atr(candles, n);
    const out = [];
    let trend = 1;
    let upper = null;
    let lower = null;
    candles.forEach((c, i) => {
      if (atr[i] == null) { out.push(null); return; }
      const hl2 = (c.h + c.l) / 2;
      const bu = hl2 + mult * atr[i];
      const bl = hl2 - mult * atr[i];
      if (upper == null) { upper = bu; lower = bl; }
      upper = c.c > upper ? bu : Math.min(bu, upper);
      lower = c.c < lower ? bl : Math.max(bl, lower);
      trend = c.c > upper ? 1 : c.c < lower ? -1 : trend;
      out.push(trend === 1 ? lower : upper);
    });
    return out;
  };

  /* ------------------------------------------------------------------ statistics */
  PS.stats = function (trades) {
    const closed = trades.filter((t) => t.status !== 'open');
    const wins = closed.filter((t) => t.pnl > 0);
    const losses = closed.filter((t) => t.pnl < 0);
    const grossWin = wins.reduce((a, t) => a + t.pnl, 0);
    const grossLoss = Math.abs(losses.reduce((a, t) => a + t.pnl, 0));
    const net = grossWin - grossLoss;
    const rWins = wins.reduce((a, t) => a + (t.r || 0), 0);
    const rLoss = Math.abs(losses.reduce((a, t) => a + (t.r || 0), 0));

    /* equity curve over closed trades in chronological order */
    const ordered = closed.slice().sort((a, b) => a.closedAt - b.closedAt);
    let run = 0;
    const curve = ordered.map((t) => (run += t.pnl));

    /* max drawdown on the curve */
    let peak = 0;
    let maxDD = 0;
    curve.forEach((v) => {
      peak = Math.max(peak, v);
      maxDD = Math.max(maxDD, peak - v);
    });

    const mean = closed.length ? net / closed.length : 0;
    const sd = closed.length > 1
      ? Math.sqrt(closed.reduce((a, t) => a + (t.pnl - mean) ** 2, 0) / (closed.length - 1))
      : 0;
    const downside = closed.length > 1
      ? Math.sqrt(losses.reduce((a, t) => a + t.pnl ** 2, 0) / closed.length)
      : 0;

    /* streaks */
    let cur = 0;
    let best = 0;
    let worst = 0;
    ordered.forEach((t) => {
      if (t.pnl > 0) cur = cur > 0 ? cur + 1 : 1;
      else if (t.pnl < 0) cur = cur < 0 ? cur - 1 : -1;
      else cur = 0;
      best = Math.max(best, cur);
      worst = Math.min(worst, cur);
    });

    return {
      count: closed.length,
      open: trades.length - closed.length,
      wins: wins.length,
      losses: losses.length,
      winRate: closed.length ? (wins.length / closed.length) * 100 : 0,
      net,
      grossWin,
      grossLoss,
      profitFactor: grossLoss ? grossWin / grossLoss : grossWin ? Infinity : 0,
      avgWin: wins.length ? grossWin / wins.length : 0,
      avgLoss: losses.length ? grossLoss / losses.length : 0,
      expectancy: closed.length ? net / closed.length : 0,
      avgR: closed.length ? (rWins - rLoss) / closed.length : 0,
      totalR: rWins - rLoss,
      maxDD,
      maxDDPct: peak > 0 ? (maxDD / peak) * 100 : 0,
      sharpe: sd ? mean / sd : 0,
      sortino: downside > Math.abs(mean) * 0.05 ? mean / downside : null,
      bestStreak: best,
      worstStreak: worst,
      curve,
      maxLoss: losses.length ? Math.min(...losses.map((t) => t.pnl)) : 0,
      maxWin: wins.length ? Math.max(...wins.map((t) => t.pnl)) : 0,
      avgHold: closed.length
        ? closed.reduce((a, t) => a + (t.closedAt - t.openedAt), 0) / closed.length
        : 0,
    };
  };

  /* group trades by a key and summarise */
  PS.groupBy = function (trades, keyFn) {
    const map = new Map();
    trades.forEach((t) => {
      const k = keyFn(t) || '—';
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(t);
    });
    return Array.from(map.entries())
      .map(([k, list]) => ({ key: k, stats: PS.stats(list), trades: list }))
      .sort((a, b) => b.stats.net - a.stats.net);
  };

  /* ------------------------------------------------------------------ sessions */
  /* Market sessions in IST (Asia/Kolkata) because that's the usual desk clock for
     the region; the label says IST explicitly to avoid ambiguity. */
  PS.SESSIONS = [
    { name: 'Sydney', open: 4 * 60, close: 13 * 60, colour: 'var(--blue)' },
    { name: 'Tokyo', open: 5 * 60 + 30, close: 14 * 60 + 30, colour: 'var(--violet)' },
    { name: 'London', open: 13 * 60 + 30, close: 22 * 60 + 30, colour: 'var(--amber)' },
    { name: 'New York', open: 18 * 60 + 30, close: 27 * 60 + 30, colour: 'var(--teal)' },
  ];

  PS.istNow = () => {
    const now = new Date();
    const utc = now.getTime() + now.getTimezoneOffset() * 60000;
    return new Date(utc + 5.5 * 3600000);
  };

  PS.sessionState = () => {
    const ist = PS.istNow();
    const day = ist.getDay();
    const mins = ist.getHours() * 60 + ist.getMinutes();
    const weekday = day >= 1 && day <= 5;
    const out = PS.SESSIONS.map((s) => {
      let active = false;
      if (weekday || day === 0) {
        const spans = s.close > 1440 ? [[s.open, s.close - 1440]] : [];
        active = mins >= s.open && mins <= Math.min(s.close, 1439);
        spans.forEach(([a, b]) => { if (mins <= b) active = true; });
      }
      return Object.assign({}, s, { active });
    });
    const anyOpen = out.some((s) => s.active);
    return { sessions: out, anyOpen, ist, mins };
  };

  /* ------------------------------------------------------------------ toast */
  let toastHost;
  PS.toast = function (msg, kind = 'ok', ms = 2600) {
    if (!toastHost) {
      toastHost = document.createElement('div');
      toastHost.className = 'toasts';
      document.body.appendChild(toastHost);
    }
    const icons = {
      ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M20 6L9 17l-5-5"/></svg>',
      err: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6L6 18M6 6l12 12"/></svg>',
      warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3l9 17H3zM12 10v4M12 17v.5"/></svg>',
    };
    const el = document.createElement('div');
    el.className = 'toast ' + kind;

  /* ------------------------------------------------------------------ modal */
  PS.modal = function ({ title, body, footer, wide, onOpen }) {
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title || 'Dialog')}">
        <div class="modal-head">
          <h2>${esc(title || '')}</h2>
          <button class="icon-btn" data-close aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="modal-body">${body || ''}</div>
        ${footer ? `<div class="modal-foot">${footer}</div>` : ''}
      </div>`;
    document.body.appendChild(backdrop);
    const close = () => {
      backdrop.remove();
      document.removeEventListener('keydown', onKey);
    };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    backdrop.addEventListener('click', (e) => {
      if (e.target === backdrop || e.target.closest('[data-close]')) close();
    });
    if (onOpen) onOpen(backdrop, close);
    return { el: backdrop, close };
  };

  PS.confirm = function (question, { danger = false, confirmLabel = 'Confirm' } = {}) {
    return new Promise((resolve) => {
      const m = PS.modal({
        title: 'Are you sure?',
        body: `<p class="sm muted">${esc(question)}</p>`,
        footer: `<button class="btn" data-close>Cancel</button>
                 <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-yes>${esc(confirmLabel)}</button>`,
        onOpen(el, close) {
          el.querySelector('[data-yes]').addEventListener('click', () => { close(); resolve(true); });
          el.addEventListener('click', (e) => { if (e.target === el || e.target.closest('[data-close]')) resolve(false); });
        },
      });
    });
  };

  PS.drawer = function ({ title, content }) {
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="drawer-backdrop"></div>
      <aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="drawer-head">
          <h2 class="h2">${esc(title)}</h2>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="drawer-body">${content}</div>
      </aside>`;
    document.body.appendChild(wrap);
    const close = () => wrap.remove();
    wrap.addEventListener('click', (e) => {
      if (e.target.classList.contains('drawer-backdrop') || e.target.closest('[data-close]')) close();
    });
    document.addEventListener('keydown', function esc2(e) {
      if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc2); }

    return close;
  };

    const out = [];
    const today = new Date();
    for (let w = 0; w < 3; w++) {
      PS.CALENDAR_TEMPLATE.forEach((e, i) => {
        const base = new Date(today);
        base.setDate(today.getDate() + ((e.day - today.getDay() + 7) % 7) + w * 7);
        const [h, m] = e.hm.split(':').map(Number);
        /* template times are IST */
        base.setHours(h, m, 0, 0);
        out.push(Object.assign({}, e, { id: 'e' + w + '_' + i, at: base.getTime() }));
      });
    }

        (ac.length ? `<div class="palette-group">Actions</div>` : '') +

  const refreshStoredRValues = () => {
    const trades = Store.get(KEYS.trades, []);
    if (!Array.isArray(trades)) return;

    let changed = false;
    const refreshed = trades.map((t) => {
      if (!t || t.status === 'open' || !t.sym || !['buy', 'sell'].includes(t.side)) return t;
      const lots = Number(t.lots);
      const entry = Number(t.entry);
      const exit = Number(t.exit);
      const stop = Number(t.sl);
      if (![lots, entry, exit, stop].every(Number.isFinite) || !lots || !entry || !exit || !stop) return t;

      const r = PS.rFor(t.sym, t.side, lots, entry, exit, stop);
      if (Number(t.r) === r) return t;
      changed = true;
      return Object.assign({}, t, { r });
    });

    if (changed) Store.set(KEYS.trades, refreshed);
  };

        ctx.stroke();

        if (this.opts.pane === 'rsi') {
          const rsi = Ind.rsi(this.data.map((d) => d.c), 14).slice(this.view.start, this.view.start + bars.length);

            const yy = pTop + pH - (lvl / 100) * pH;
            ctx.strokeStyle = 'rgba(255,255,255,0.07)';
            ctx.setLineDash([2, 4]);
            ctx.beginPath();
            ctx.moveTo(pad.left, yy);
            ctx.lineTo(pad.left + this._plotW, yy);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = C.axis;
            ctx.font = '8.5px ui-monospace, monospace';
            ctx.textAlign = 'left';
            ctx.fillText(String(lvl), pad.left + this._plotW + 7, yy);
          });
          ctx.beginPath();
          let started = false;
          rsi.forEach((v, i) => {

          });

          ctx.stroke();

          ctx.textAlign = 'left';

          const hist = m.hist.slice(this.view.start, this.view.start + bars.length);
          const vals = hist.filter((v) => v != null);

          const zero = pTop + pH / 2;
          hist.forEach((v, i) => {

            sl.forEach((v, i) => {

              const yy = zero - (v / mx) * (pH / 2 - 2);

            ctx.stroke();

          bars.forEach((b, i) => {
            const hgt = ((b.v || 0) / vmax) * (pH - 4);
            const up = b.c >= b.o;
            ctx.fillStyle = up ? 'rgba(63,214,139,0.34)' : 'rgba(242,85,90,0.34)';
            ctx.fillRect(x(i) - Math.max(1, bw * 0.3), pBot - hgt, Math.max(1.4, bw * 0.6), hgt);
          });
        }
      }

      /* markers */
      this.opts.markers.forEach((m) => {
        const idx = m.i - this.view.start;
        if (idx < 0 || idx >= bars.length) return;
        const cx = x(idx);
        const cy = y(m.price);
        ctx.beginPath();
        if (m.shape === 'up') {
          ctx.moveTo(cx, cy - 7);
          ctx.lineTo(cx - 4, cy + 1);
          ctx.lineTo(cx + 4, cy + 1);
        } else {
          ctx.moveTo(cx, cy + 7);
          ctx.lineTo(cx - 4, cy - 1);
          ctx.lineTo(cx + 4, cy - 1);
        }
        ctx.closePath();
        ctx.fillStyle = m.colour || C.amber;
        ctx.fill();
      });

      /* crosshair */
      if (this.hover && this.hover.x >= pad.left && this.hover.x <= pad.left + this._plotW) {
        const hx = this.hover.x;
        const hy = clamp(this.hover.y, pad.top, pad.top + mainH);
        ctx.strokeStyle = C.cross;
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(Math.round(hx) + 0.5, pad.top);
        ctx.lineTo(Math.round(hx) + 0.5, pad.top + mainH);
        ctx.moveTo(pad.left, Math.round(hy) + 0.5);
        ctx.lineTo(pad.left + this._plotW, Math.round(hy) + 0.5);
        ctx.stroke();
        ctx.setLineDash([]);

        const price = hi - ((hy - pad.top) / mainH) * (hi - lo);
        const lbl = fmt(price, PS.decimals(price));
        ctx.font = '9.5px ui-monospace, monospace';
        const w = ctx.measureText(lbl).width + 10;
        ctx.fillStyle = cssVar('--panel-3', '#1b1f24');
        ctx.fillRect(pad.left + this._plotW + 3, hy - 8, w, 16);
        ctx.strokeStyle = C.cross;
        ctx.strokeRect(pad.left + this._plotW + 3.5, hy - 7.5, w - 1, 15);
        ctx.fillStyle = cssVar('--ink', '#e9ebee');
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(lbl, pad.left + this._plotW + 8, hy);

        const idx = this._indexAt(hx);
        if (idx >= 0) {
          const d = new Date(this.data[idx].t);
          const ts = d.toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
          const tw = ctx.measureText(ts).width + 12;
          const cx2 = clamp(hx - tw / 2, pad.left, pad.left + this._plotW - tw);
          ctx.fillStyle = cssVar('--panel-3', '#1b1f24');
          ctx.fillRect(cx2, pad.top + mainH + 2, tw, 15);
          ctx.fillStyle = cssVar('--ink-2', '#a6adb7');
          ctx.textAlign = 'center';
          ctx.fillText(ts, cx2 + tw / 2, pad.top + mainH + 10);
        }
      }

      /* last price tag on axis */
      if (lastBar && this.opts.showAxis) {
        const cy = y(lastBar.c);
        if (cy > pad.top && cy < pad.top + mainH) {
          const lbl = fmt(lastBar.c, PS.decimals(lastBar.c));
          ctx.font = '9.5px ui-monospace, monospace';
          const w = ctx.measureText(lbl).width + 10;
          const up = lastBar.c >= lastBar.o;
          ctx.fillStyle = up ? C.up : C.down;
          ctx.fillRect(pad.left + this._plotW + 3, cy - 8, w, 16);
          ctx.fillStyle = '#0a0b0d';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.fillText(lbl, pad.left + this._plotW + 8, cy);
        }
      }
    }

    _drawSeries(series, x, y, colour, width, dash) {
      const ctx = this.ctx;
      ctx.beginPath();
      let started = false;
      series.forEach((v, i) => {
        if (v == null || !isFinite(v)) return;
        const yy = y(v);
        if (!started) { ctx.moveTo(x(i), yy); started = true; } else ctx.lineTo(x(i), yy);
      });
      ctx.strokeStyle = colour;
      ctx.lineWidth = width || 1.3;
      if (dash) ctx.setLineDash(dash);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  PS.Chart = Chart;

  /* helper: equity curve as SVG string (used in several pages) */
  PS.equitySvg = function (values, { w = 520, h = 150, colour = null, showZero = true, fill = true } = {}) {
    if (!values || values.length < 2) {
      return `<div class="empty">Not enough data yet.</div>`;
    }
    const max = Math.max(...values, 0);
    const min = Math.min(...values, 0);
    const pad = (max - min) * 0.12 || 1;
    const hi = max + pad;
    const lo = min - pad;
    const px = (i) => (i / (values.length - 1)) * w;
    const py = (v) => h - ((v - lo) / (hi - lo)) * h;
    const col = colour || (values[values.length - 1] >= 0 ? C.up : C.down);
    const line = values.map((v, i) => `${i ? 'L' : 'M'}${px(i).toFixed(1)} ${py(v).toFixed(1)}`).join(' ');
    const zeroY = py(0);
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px">
      <defs><linearGradient id="eqg${Math.random().toString(36).slice(2, 7)}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${col}" stop-opacity=".26"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/>
      </linearGradient></defs>
      ${showZero ? `<line x1="0" x2="${w}" y1="${zeroY}" y2="${zeroY}" stroke="rgba(255,255,255,0.12)" stroke-dasharray="3 4"/>` : ''}
      ${fill ? `<path d="${line} L${w} ${h} L0 ${h} Z" fill="url(#eqg${'F'})" opacity=".85"/>` : ''}
      <path d="${line}" fill="none" stroke="${col}" stroke-width="1.7" stroke-linejoin="round"/>
    </svg>`.replace(`url(#eqgF)`, `url(#eqg${'x'})`);
  };

  /* simple sparkline */
  PS.sparkSvg = function (values, { w = 70, h = 20, colour } = {}) {
    if (!values || values.length < 2) return '';
    const max = Math.max(...values);
    const min = Math.min(...values);
    const px = (i) => (i / (values.length - 1)) * w;
    const py = (v) => h - 2 - ((v - min) / (max - min || 1)) * (h - 4);
    const d = values.map((v, i) => `${i ? 'L' : 'M'}${px(i).toFixed(1)} ${py(v).toFixed(1)}`).join(' ');
    const col = colour || (values[values.length - 1] >= values[0] ? C.up : C.down);
    return `<svg viewBox="0 0 ${w} ${h}" style="width:${w}px;height:${h}px" aria-hidden="true"><path d="${d}" fill="none" stroke="${col}" stroke-width="1.3" stroke-linejoin="round"/></svg>`;
  };

  /* donut */
  PS.donutSvg = function (segments, { size = 132, thickness = 13 } = {}) {
    const total = segments.reduce((a, s) => a + Math.max(0, s.value), 0) || 1;
    const r = (size - thickness) / 2;
    const cx = size / 2;
    const cy = size / 2;
    const circ = 2 * Math.PI * r;
    let acc = 0;
    const arcs = segments
      .map((s) => {
        const frac = Math.max(0, s.value) / total;
        const dash = frac * circ;
        const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.colour}"
          stroke-width="${thickness}" stroke-dasharray="${dash} ${circ - dash}"
          stroke-dashoffset="${-acc}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>`;
        acc += dash;
        return el;
      })
      .join('');
    return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="${thickness}"/>
      ${arcs}
    </svg>`;
  };

  /* horizontal bar list */
  PS.barListHtml = function (rows, { max = null, format = (v) => PS.signed(v, 2) } = {}) {
    const top = max || Math.max(1, ...rows.map((r) => Math.abs(r.value)));
    return rows
      .map(
        (r) => `<div style="display:grid;grid-template-columns:minmax(70px,1fr) 2.2fr auto;gap:10px;align-items:center;padding:5px 0">
          <span class="xs" style="color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${PS.esc(r.label)}</span>
          <span class="bar ${r.value >= 0 ? 'green' : 'red'}" style="height:5px"><i style="width:${clamp((Math.abs(r.value) / top) * 100, 2, 100)}%"></i></span>
          <span class="mono xs ${r.value >= 0 ? 'up' : 'dn'}" style="min-width:62px;text-align:right">${format(r.value)}</span>
        </div>`
      )
      .join('');
  };
})();


/* ==========================================================================
   PipSage Desk — shared UI helpers
